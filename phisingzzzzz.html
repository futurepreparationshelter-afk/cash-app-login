<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NateGameShop</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    header {
      background: #333;
      color: white;
      padding: 10px 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
    }

    .section {
      padding: 20px;
      background: white;
      margin: 10px;
      border-radius: 8px;
    }

    .item {
      margin-bottom: 15px;
    }

    .item h3 {
      margin: 0 0 5px 0;
    }

    .item p {
      margin: 0 0 10px 0;
    }

    .buy-btn {
      display: inline-block;
      padding: 10px 15px;
      background: #28a745;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      margin-top: 10px;
    }

    .buy-btn:hover {
      background: #218838;
    }
  </style>
</head>
<body>

  <header>
    <h1>NateGameShop</h1>
    <p>Telegram: <a href="t.me/NateGameShop" style="color: white;">t.me/NateGameShop</a></p>
  </header>

  <section class="section">
    <h2>🔥 Hot Products</h2>
    <div class="item">
      <h3>CC (Mastercard)</h3>
      <p>$50.00 USD</p>
      <a href="t.me/NateGameShop" class="buy-btn">Buy</a>
    </div>
    <div class="item">
      <h3>CC (VISA)</h3>
      <p>$55.00 USD</p>
      <a href="t.me/NateGameShop" class="buy-btn">Buy</a>
    </div>
    <!-- Add more items the same way -->
  </section>

  <section class="section">
    <h2>💳 Verified Wallets</h2>
    <div class="item">
      <h3>ID Verified CashApp</h3>
      <p>$70.00 USD</p>
      <a href="t.me/NateGameShop" class="buy-btn">Buy</a>
    </div>
    <!-- Add more items the same way -->
  </section>

  <!-- Add more sections for Banks, Crypto, CC Bundles, etc. -->

</body>
</html>
